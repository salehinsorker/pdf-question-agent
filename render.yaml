services:
  - type: web
    name: pdf-question-agent-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_VISION_MODEL
        value: gpt-4o-mini
      - key: OPENAI_ANSWER_MODEL
        value: gpt-4o-mini
